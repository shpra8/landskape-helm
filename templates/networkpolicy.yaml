apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-{{ .Values.env }}-networkpolicy
  namespace: {{ .Release.Namespace }}
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}-{{ .Values.env }}
  policyTypes:
    - Egress